    <div class="header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <button id="toggle-sessions-btn" onclick="toggleSessionPanel()" style="background: #f0f0f0; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 16px;">☰ 会话</button>
            Agent
        </div>
        <span id="connection-status" class="status-indicator disconnected">●</span>
    </div>
    
    <div class="main-container">
        <div id="sessions-panel" style="display: block;">
            <div style="padding: 15px;">
                <h3 style="margin: 0 0 10px 0; font-size: 16px;">会话列表</h3>
            </div>
            <div id="sessions-list" style="padding: 10px;"></div>
            <div style="padding: 10px; border-top: 1px solid #ddd;">
                <button class="add-new-session" id="create-new-session">+ 新建会话</button>
            </div>
        </div>
        <div class="panel chat-panel">
            <div class="panel-header">💬 对话交互</div>
            <div class="messages" id="messages">
            </div>
            <div class="input-area">

                    <textarea id="input" placeholder="输入问题... (Shift+Enter 换行)"></textarea>
                    <div class="button-group">
                        <button id="sendBtn" onclick="send()">发送</button>
                        <button id="stopBtn" onclick="stop()" style="display:none;">停止</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="panel workspace-panel">
            <div class="tabs-header" id="tabs-header">
                <div class="tab-item active" onclick="switchTab('tool-logs-tab')">
                    🛠️ 工作台
                </div>
            </div>
            
            <div class="tabs-content" id="tabs-content">
                <div id="tool-logs-tab" class="tab-pane active tool-logs-container">
                    <div id="statusUpdates" class="status-list"></div>
                </div>
            </div>
        </div>
    </div>
