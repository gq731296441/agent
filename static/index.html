<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>agent</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<body>
    <div style="display: flex;">
        <div id="session-container" style="position: relative;background: #fafafa;box-shadow: 2px 0 12px rgba(0, 0, 0, 0.1);width: 250px;transition: 0.3s;">
            <div class="session-top">
                <span class="toggle-sessions" id="toggle-sessions-btn" onclick="toggleSessionPanel()" title="会话列表">
                    <svg t="1767946871054" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="4649" width="24" height="24"><path d="M740.395 188c88.365 0 160 71.635 160 160v329.347c-0.001 88.365-71.635 159.999-160 160H280c-88.366 0-160-71.635-160-160V348c0-88.365 71.634-160 160-160h460.395zM280 252c-53.019 0-96 42.981-96 96v329.347c0 53.019 42.981 96 96 96h134.051V252H280z m198.051 521.347h262.344c53.019-0.001 95.999-42.981 96-96V348c0-53.019-42.981-96-96-96H478.051v521.347zM337.367 456.266c17.673 0 32 14.326 32 32 0 17.673-14.327 32-32 32H264.33c-17.673-0.001-32-14.327-32-32 0-17.673 14.327-32 32-32h73.037z m0-122.86c17.673 0 32 14.327 32 32 0 17.673-14.327 32-32 32H264.33c-17.673 0-32-14.327-32-32 0-17.673 14.327-32 32-32h73.037z" fill="#707070" p-id="4650"></path></svg>
                </span>
                <span class="add-new-session" id="create-new-session"  onclick="addNewSessionButton()" title="新建会话">
                   <svg t="1767950457323" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="5036" width="24" height="24"><path d="M512 188c17.673 0 32 14.327 32 32 0 17.673-14.327 32-32 32H304c-48.601 0-88 39.399-88 88v320.108c0 48.601 39.399 88 88 88h28.935c21.144 0 42.056 4.411 61.399 12.953l82.119 36.261a87.997 87.997 0 0 0 71.094 0l82.119-36.261a151.988 151.988 0 0 1 61.399-12.953H720c48.601 0 88-39.399 88-88V500.054c0-17.673 14.327-32 32-32 17.673 0 32 14.327 32 32v160.054c0 83.948-68.053 152-152 152h-28.935a88.011 88.011 0 0 0-35.546 7.499l-82.12 36.261a151.994 151.994 0 0 1-122.798 0l-82.12-36.261a88.011 88.011 0 0 0-35.546-7.499H304c-83.947 0-152-68.052-152-152V340c0-83.947 68.053-152 152-152h208z m216-32c17.673 0 32 14.327 32 32v96h96c17.673 0 32 14.327 32 32 0 17.673-14.327 32-32 32h-96v96c0 17.673-14.327 32-32 32-17.673 0-32-14.327-32-32v-96h-96c-17.673 0-32-14.327-32-32 0-17.673 14.327-32 32-32h96v-96c0-17.673 14.327-32 32-32z" fill="#707070" p-id="5037"></path></svg>
                    <span id="add-new-session-text" style="margin-left: 10px;transition: 0.3s;">新建会话</span>
                </span>
            </div>
            <div class="session-bottom">
                <div id="sessions-panel" style="display: block;">
                <div id="sessions-list" style="padding: 10px;"></div>
            </div>
            </div>
        </div>
        <div style="display: flex;flex-direction: column;flex: 1;height: 100vh;">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    Agent
                </div>
                <span id="connection-status" class="status-indicator disconnected">●</span>
            </div>
            
            <div class="main-container">
                <div class="panel chat-panel">
                    <div class="panel-header">💬 对话交互</div>
                    <div class="messages" id="messages">
                    </div>
                    <div class="input-area">
                        <div style="display: flex;flex-direction: column;padding: 5px 10px;border: solid 1px #e0e0e0;border-radius: 12px;">
                            <div class="input-container" style="display: flex;flex-direction: row;align-items: center;">
                                <textarea id="input" placeholder="输入问题... (Shift+Enter 换行)"></textarea>
                            </div>
                            <div class="bottom-button-container" style="display: flex;align-items: center;justify-content: space-between;">
                                <div style="display: flex;">
                                    <div class="file-upload">
                                        <span>
                                            <svg t="1767944405770" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="3352" width="24" height="24"><path d="M842.72 259.904a159.04 159.04 0 0 0-113.056-46.912h-0.16a158.592 158.592 0 0 0-112.768 46.656l-0.096 0.064-294.528 294.528a95.968 95.968 0 0 0 68.128 163.712c24.512 0 49.024-9.28 67.648-27.968l294.496-294.496a31.968 31.968 0 1 0-45.248-45.248l-294.496 294.496a31.872 31.872 0 0 1-45.088-0.16 31.552 31.552 0 0 1-0.192-45.088l294.496-294.496a95.04 95.04 0 0 1 67.648-28h0.096a95.52 95.52 0 0 1 67.872 28.16c18.112 18.112 28.096 42.24 28.128 67.84a95.136 95.136 0 0 1-27.968 67.776l-79.52 79.52-0.512 0.48-220.416 220.48a160.32 160.32 0 0 1-226.432 0.096A158.912 158.912 0 0 1 224 628.224c0-42.816 16.672-83.04 46.912-113.28l300.288-300.32a31.968 31.968 0 1 0-45.248-45.248l-300.288 300.288A222.848 222.848 0 0 0 160 628.224c0 59.872 23.264 116.16 65.504 158.4a223.168 223.168 0 0 0 158.336 65.44 223.68 223.68 0 0 0 158.592-65.6l311.456-311.424a31.68 31.68 0 0 0 7.104-11.072c18.496-26.56 28.64-57.92 28.608-91.04a159.104 159.104 0 0 0-46.88-113.024" fill="#707070" p-id="3353"></path></svg>
                                        </span>
                                    </div>
                                    <div class="mcp-tools" onclick="toggleMcpPanel()">
                                        <span>
                                            <svg t="1767945826826" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="1333" width="24" height="24"><path d="M358.4 537.6A128 128 0 0 1 486.4 665.6v153.6A128 128 0 0 1 358.4 947.2H204.8A128 128 0 0 1 76.8 819.2v-153.6A128 128 0 0 1 204.8 537.6h153.6zM204.8 614.4a51.2 51.2 0 0 0-51.2 51.2v153.6a51.2 51.2 0 0 0 51.2 51.2h153.6a51.2 51.2 0 0 0 51.2-51.2v-153.6a51.2 51.2 0 0 0-51.2-51.2H204.8z" p-id="1334" fill="#707070"></path><path d="M678.5024 598.3744a27.3408 27.3408 0 0 1 47.2576-12.6464l58.7264 66.4064c3.9424 4.4544 9.216 7.5264 15.0528 8.704l86.9376 17.664c22.1184 4.5056 29.5424 32.256 12.6464 47.2064l-66.4576 58.7264a27.3408 27.3408 0 0 0-8.704 15.0528l-17.6128 86.9888a27.3408 27.3408 0 0 1-47.2576 12.6464l-58.7264-66.56a27.2896 27.2896 0 0 0-15.0016-8.6016l-87.04-17.664a27.3408 27.3408 0 0 1-12.5952-47.2576l66.4576-58.6752a27.392 27.392 0 0 0 8.704-15.0528l17.6128-86.9376z" p-id="1335" fill="#707070"></path><path d="M358.4 76.8A128 128 0 0 1 486.4 204.8v153.6A128 128 0 0 1 358.4 486.4H204.8A128 128 0 0 1 76.8 358.4V204.8A128 128 0 0 1 204.8 76.8h153.6zM204.8 153.6a51.2 51.2 0 0 0-51.2 51.2v153.6a51.2 51.2 0 0 0 51.2 51.2h153.6a51.2 51.2 0 0 0 51.2-51.2V204.8a51.2 51.2 0 0 0-51.2-51.2H204.8zM819.2 76.8A128 128 0 0 1 947.2 204.8v153.6A128 128 0 0 1 819.2 486.4h-153.6A128 128 0 0 1 537.6 358.4V204.8A128 128 0 0 1 665.6 76.8h153.6zM665.6 153.6a51.2 51.2 0 0 0-51.2 51.2v153.6a51.2 51.2 0 0 0 51.2 51.2h153.6a51.2 51.2 0 0 0 51.2-51.2V204.8a51.2 51.2 0 0 0-51.2-51.2h-153.6z" p-id="1336" fill="#707070"></path></svg>
                                        </span>
                                        <span style="margin-left: 5px;">
                                            <span id="mcp-status" class="status-indicator disconnected">●</span>
                                        </span>
                                    </div>
                                    <div class="mcp-control">
                                        <div id="mcp-panel" style="display:none; position:absolute; background:white; border:1px solid #ccc; padding:10px;">
                                            <!-- <h4>已连接服务:</h4>
                                            <ul id="mcp-server-list">
                                                </ul>
                                            <hr> -->
                                            <h4>已加载工具:</h4>
                                            <ul id="mcp-tool-list">
                                                </ul>
                                            <hr>
                                            <!-- <h4>添加新服务:</h4>
                                            <input type="text" id="new-mcp-id" placeholder="ID (e.g. email)">
                                            <input type="text" id="new-mcp-port" placeholder="Port (e.g. 8000)">
                                            <button onclick="addMcpServer()">添加</button> -->
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <div class="button-group">
                                        <span id="sendBtn" onclick="send()">
                                            <svg t="1767944600774" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="1157" width="24" height="24"><path fill="#000" d="M738.707 151.339c95.586-34.49 188.094 58.019 153.605 153.605L695.528 850.316c-34.785 96.406-166.614 107.65-217.225 18.529l-93.595-164.812a120.002 120.002 0 0 0-45.09-45.091l-164.813-93.595c-89.121-50.611-77.876-182.44 18.529-217.225l545.373-196.783z m93.404 131.884c16.095-44.607-27.076-87.779-71.683-71.683L215.056 408.323c-44.989 16.234-50.236 77.754-8.647 101.372l164.813 93.594a183.999 183.999 0 0 1 69.139 69.139l93.595 164.814c23.618 41.589 85.138 36.342 101.371-8.647l196.784-545.372z m-180.648 98.725c12.497 12.497 12.497 32.758 0 45.255l-144.25 144.25c-12.496 12.497-32.758 12.497-45.255 0-12.496-12.497-12.496-32.758 0-45.255l144.25-144.25c12.497-12.496 32.758-12.496 45.255 0z" p-id="1158"></path></svg>
                                        </span>
                                        <span id="stopBtn" onclick="stop()" style="display:none;">
                                            <svg t="1767944998512" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2903" width="24" height="24"><path fill="#d81e06" d="M512.438 140c205.693 0 372.44 166.746 372.44 372.438 0 205.693-166.747 372.44-372.44 372.44C306.746 884.878 140 718.131 140 512.438 140 306.746 306.746 140 512.438 140z m0 64C342.093 204 204 342.093 204 512.438c0 170.346 138.093 308.44 308.438 308.44 170.347 0 308.44-138.093 308.44-308.44C820.878 342.093 682.784 204 512.438 204zM592 392c22.091 0 40 17.909 40 40v160c0 22.091-17.909 40-40 40H432c-22.091 0-40-17.909-40-40V432c0-22.091 17.909-40 40-40h160z" p-id="2904"></path></svg>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="panel workspace-panel">
                    <div class="tabs-header" id="tabs-header">
                        <div class="tab-item active" onclick="switchTab('tool-logs-tab')">
                            🛠️ 工作台
                        </div>
                    </div>
                    
                    <div class="tabs-content" id="tabs-content">
                        <div id="tool-logs-tab" class="tab-pane active tool-logs-container">
                            <div id="statusUpdates" class="status-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
