/* 全局重置 */

}

body {

  padding: 32px 24px;

}

.header-content {

  margin: 0 auto;
}

.report-title {

}

.report-subtitle {

}

/* 主内容区 */
.main-content {

  padding: 24px;

/* TAB导航 */
.tabs-container {

  padding: 8px;
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
}

.tab-button {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.3s ease;
}

.tab-button:hover {
  background-color: var(--bg-color);
  color: var(--text-primary);
}

.tab-button.active {
  background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
  color: white;
  box-shadow: var(--shadow-sm);
}

.tab-icon {
  width: 20px;
  height: 20px;
}

/* TAB内容 */
.tab-content {
  display: none;
  animation: fadeIn 0.3s ease;
}

.tab-content.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 章节标题 */
.section-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--border-color);
}

/* 统计卡片区域 */
.stats-section {
  margin-bottom: 32px;
}

.stats-grid {

  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.stat-card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}

.stat-icon {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.stat-icon svg {
  width: 28px;
  height: 28px;
}

.stat-icon.audit {
  background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  color: white;
}

.stat-icon.nonconforming {
  background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
  color: white;
}

.stat-icon.compliant {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
}

.stat-icon.ratio {
  background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
  color: white;
}

.stat-icon.rejected {
  background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
  color: white;
}

.stat-info {
  flex: 1;
}

.stat-value {

  font-weight: 700;
  color: var(--text-primary);

}

.stat-label {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* 饼图区域 */

  background: var(--card-bg);
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--shadow-sm);

.chart-container {

  flex-wrap: wrap;
  gap: 32px;
  align-items: center;
  justify-content: center;
}

.pie-chart-wrapper {

  width: 420px;
  height: 420px;
}

.pie-legend {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-color);
  border-radius: 8px;
  min-width: 280px;
}

.legend-color {

  height: 20px;
  border-radius: 4px;

}

.legend-label {

  font-size: 14px;
  color: var(--text-primary);
}

.legend-value {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
}

/* 按期关闭率区域 */
.closure-section {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--shadow-sm);
}

.closure-card {
  background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
  border-radius: 12px;
  padding: 24px;
  color: white;
}

.closure-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 24px;
}

.closure-item {
  text-align: center;
}

.closure-label {
  font-size: 16px;
  opacity: 0.9;
  margin-bottom: 8px;
}

.closure-value {
  font-size: 30px;
  font-weight: 700;
}

.closure-item.highlight .closure-value {

  color: #fbbf24;
}

.closure-item.highlight .closure-value.rate {
  font-size: 44px;
}

/* 多月份按期关闭率表格 */
.closure-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 16px;
  color: white;
}

.closure-table th {
  padding: 12px 16px;
  text-align: center;
  font-weight: 600;
  border-bottom: 2px solid rgba(255,255,255,0.3);
  opacity: 0.9;
}

.closure-table td {
  padding: 12px 16px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}

.closure-table tr.closure-total {
  background: rgba(255,255,255,0.12);
  font-weight: 700;
}

.closure-table tr.closure-total td {
  border-top: 2px solid rgba(255,255,255,0.3);
  color: #fbbf24;
}

/* 表格区域 */
.table-section {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--shadow-sm);
}

.table-wrapper {
  overflow: visible;
}

.data-table {

  border-collapse: collapse;
  font-size: 14px;
  table-layout: auto;
}

.data-table thead {
  background: var(--bg-color);

.data-table th {

  word-break: break-word;
}

.data-table tbody tr {

  transition: background-color 0.2s ease;
}

.data-table tbody tr:hover {
  background-color: var(--bg-color);
}

.data-table td {
  padding: 14px 12px;
  color: var(--text-secondary);
  vertical-align: top;
  word-break: break-word;
  overflow-wrap: break-word;
  white-space: normal;
}

.data-table td:first-child {
  font-weight: 500;
  color: var(--text-primary);
}

.status-badge {

.status-badge.status-done {

.work-item-link:hover {

/* 月份筛选 */
.filter-bar {

  align-items: center;
  gap: 12px;
  background: var(--bg-color);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);

.month-filter {

  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 14px;
  background: var(--card-bg);
  color: var(--text-primary);

.month-filter:focus {

/* 状态统计摘要（标题下方另起一行） */
.status-summary {

.status-item {

.status-dot {

/* 页脚 */

}

// ===== TAB切换 =====
function initTabs() {
  const tabButtons = document.querySelectorAll('.tab-button');
  const tabContents = document.querySelectorAll('.tab-content');

  tabButtons.forEach(button => {
    button.addEventListener('click', function () {
      const targetTab = this.getAttribute('data-tab');
      tabButtons.forEach(btn => btn.classList.remove('active'));
      tabContents.forEach(content => content.classList.remove('active'));
      this.classList.add('active');
      document.getElementById(targetTab).classList.add('active');
      if (targetTab === 'overview') {
        drawAuditPieChart(REPORT_DATA.auditDist, REPORT_DATA.stats.total);
        drawTaskPieChart(REPORT_DATA.taskDist, REPORT_DATA.stats.taskTotal);
      }
    });
  });
}

// ===== 图例 =====
function renderLegend(containerId, data) {

// ===== 饼图绘制 =====
function drawPie(canvasId, data, centerValue, centerLabel, centerColor) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  const centerX = width / 2;
  const centerY = height / 2;
  const radius = Math.min(width, height) / 2 - 20;

  ctx.clearRect(0, 0, width, height);
  let startAngle = -Math.PI / 2;

  data.forEach(item => {
    const sliceAngle = (item.percentage / 100) * 2 * Math.PI;
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, startAngle, startAngle + sliceAngle);
    ctx.closePath();
    ctx.fillStyle = item.color;
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    const labelAngle = startAngle + sliceAngle / 2;
    const labelRadius = radius * 0.7;
    const labelX = centerX + Math.cos(labelAngle) * labelRadius;
    const labelY = centerY + Math.sin(labelAngle) * labelRadius;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.percentage + '%', labelX, labelY);

    startAngle += sliceAngle;
  });

  // 中心圆
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius * 0.5, 0, 2 * Math.PI);
  ctx.fillStyle = '#ffffff';
  ctx.fill();

  ctx.fillStyle = centerColor;
  ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(centerValue), centerX, centerY - 10);
  ctx.fillStyle = '#64748b';
  ctx.font = '14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  ctx.fillText(centerLabel, centerX, centerY + 12);
}

function drawAuditPieChart(data, total) {
  drawPie('auditPieChart', data, total, '项审核', '#3b82f6');
}

function drawTaskPieChart(data, total) {
  drawPie('pieChart', data, total, '项任务', '#1e40af');
}

// ===== 按期关闭率 =====
function renderClosure(closure) {
  const grid = document.getElementById('closure-grid');
  const months = closure.months || [];
  const hasTotal = closure.total && months.length > 1;

  // 单个月份：使用卡片展示
  if (months.length <= 1) {
    const items = [
      { label: '月份', value: closure.month },
      { label: '不符合项数', value: closure.notPassCount },
      { label: '按期关闭数', value: closure.onTimeCount },
      { label: '按期关闭率', value: closure.onTimeRate, highlight: true, rate: true },
    ];
    let html = '';
    items.forEach(item => {
      const cls = item.highlight ? 'closure-item highlight' : 'closure-item';
      const valCls = item.rate ? 'closure-value rate' : 'closure-value';
      html += '<div class="' + cls.trim() + '">' +
        '<div class="closure-label">' + item.label + '</div>' +
        '<div class="' + valCls.trim() + '">' + item.value + '</div>' +
        '</div>';
    });
    grid.innerHTML = html;
    return;
  }

  // 多个月份：使用表格展示（含总计行）
  let html = '<table class="closure-table">' +
    '<thead><tr>' +
    '<th>月份</th><th>不符合项数</th><th>按期关闭数</th><th>按期关闭率</th>' +
    '</tr></thead><tbody>';
  months.forEach(m => {
    html += '<tr>' +
      '<td>' + esc(m['月份']) + '</td>' +
      '<td>' + esc(m['不符合项数']) + '</td>' +
      '<td>' + esc(m['按期关闭数']) + '</td>' +
      '<td>' + esc(m['按期关闭率']) + formatRate(m['按期关闭率']) + '</td>' +
      '</tr>';
  });
  if (hasTotal) {
    const t = closure.total;
    html += '<tr class="closure-total">' +
      '<td>' + esc(t['月份']) + '</td>' +
      '<td>' + esc(t['不符合项数']) + '</td>' +
      '<td>' + esc(t['按期关闭数']) + '</td>' +
      '<td>' + esc(t['按期关闭率']) + formatRate(t['按期关闭率']) + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  grid.innerHTML = html;
}

// 按期关闭率格式化：数值加%，NA不加
function formatRate(rate) {
  if (rate === 'NA' || rate === null || rate === undefined || rate === '') return '';
  return '%';
}

// ===== 转义 =====
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ===== 去除HTML标签 =====
function stripHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/<[^>]*>/g, '')   // 去除所有HTML标签
    .replace(/&nbsp;/g, ' ')   // 替换 &nbsp; 为空格
    .replace(/&amp;/g, '&')    // 还原 &amp;
    .replace(/&lt;/g, '<')     // 还原 &lt;
    .replace(/&gt;/g, '>')     // 还原 &gt;
    .replace(/&quot;/g, '"')   // 还原 &quot;
    .replace(/&#39;/g, "'")    // 还原 &#39;
    .replace(/\s+/g, ' ')      // 合并多余空白
    .trim();
}

const WORK_ITEM_BASE_URL = 'https://rdcloud.zte.com.cn/uportal/rd-uportal/workspaces/YXCA/apps/wim/allWorkItems/';

function idLink(id) {
  if (!id) return '-';

// ===== 审核结果徽章 =====
function resultBadge(result) {
  if (result === '通过') return '<span class="status-badge status-new">通过</span>';
  if (result === '不通过') return '<span class="status-badge status-rejected">不通过</span>';
  return esc(result) || '-';
}

// ===== 状态徽章 =====
function stateBadge(state) {
  if (state === '新建') return '<span class="status-badge status-new">新建</span>';
  if (state === '执行中') return '<span class="status-badge status-executing">执行中</span>';
  if (state === '待人工验收') return '<span class="status-badge status-pending">待人工验收</span>';
  if (state === '已完成') return '<span class="status-badge status-done">已完成</span>';
  if (state === '待确认拒绝') return '<span class="status-badge status-pending-reject">待确认拒绝</span>';
  if (state === '已确认拒绝') return '<span class="status-badge status-rejected">已确认拒绝</span>';
  return esc(state) || '-';
}

// ===== TAB标题状态统计 =====
// 状态颜色映射
const STATUS_COLORS = {
  '总计': '#1e40af',
  '不通过': '#ef4444',
  '通过': '#10b981',
  '部分通过': '#f59e0b',
  '不涉及': '#8b5cf6',
  '-': '#94a3b8',
  '新建': '#3b82f6',
  '执行中': '#f59e0b',
  '待人工验收': '#8b5cf6',
  '已完成': '#10b981',
  '待确认拒绝': '#ef4444',
  '已确认拒绝': '#92400e',
};

// 状态颜色回退（未定义时按顺序分配）
const STATUS_COLOR_PALETTE = [
  '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4',
  '#ec4899', '#14b8a6', '#f97316', '#84cc16', '#6366f1',
];

function statusColor(name, index) {
  if (STATUS_COLORS[name] !== undefined) return STATUS_COLORS[name];
  return STATUS_COLOR_PALETTE[index % STATUS_COLOR_PALETTE.length];
}

function renderStatusSummary(containerId, status, total) {
  const container = document.getElementById(containerId);
  if (!container) return;
  let html = '';
  // 总计放最前面
  html += '<span class="status-item">' +
    '<span class="status-dot" style="background:' + statusColor('总计', 0) + ';"></span>' +
    '总计：' + total + '</span>';
  // 各状态（容错：status 可能为 undefined/null）
  let idx = 1;
  const statusObj = status || {};
  Object.keys(statusObj).forEach(k => {
    html += '<span class="status-item">' +
      '<span class="status-dot" style="background:' + statusColor(k, idx) + ';"></span>' +
      k + '：' + statusObj[k] + '</span>';
    idx++;
  });
  container.innerHTML = html;
}

function renderChecklistTitle(status, total) {
  renderStatusSummary('checklist-status', status, total);
}

function renderTasksTitle(status, total) {
  renderStatusSummary('tasks-status', status, total);
}

// ===== 月份筛选 =====
function initMonthFilter(type, months) {
  const filterBar = document.getElementById(type + '-filter');
  const select = document.getElementById(type + '-month-filter');
  if (!filterBar || !select) return;

  // 只有多个月份时才显示筛选
  if (!months || months.length <= 1) {
    filterBar.style.display = 'none';
    return;
  }
  filterBar.style.display = 'flex';

  // 填充月份选项（已由后端升序排列）
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  // 监听筛选变化
  select.addEventListener('change', function () {
    const month = this.value;
    const allData = REPORT_DATA[type === 'checklist' ? 'checklist' : 'tasks'];
    const filtered = month === 'all' ? allData : allData.filter(r => String(r['审核月份']) === month);
    if (type === 'checklist') {
      renderChecklistTable(filtered);
    } else {
      renderTasksTable(filtered);
    }
  });
}
